# Species that Providentia can read, plot and save, whatever the GHOST version (or none, e.g.
# for gridded data). One entry per species, named as in Providentia (bsc_parameter_name), with:
#   long_parameter_name      description, written in saved files
#   matrix                   matrix of the species, as in the menus and in the data folders
#   standard_units           units of the data
#   units_quantity           kind of quantity of the units, for unit conversions
#   chemical_formula         formula, for unit conversions that need the molar mass
#   chemical_formula_charge  formula with its charge, for ions
#   extreme_lower_limit      default lower bound, and limit of the negative values QA
#   extreme_upper_limit      default upper bound
#   minimum_resolution       resolution of the instruments (.nan if not known)
#
# Generated from the GHOST 1.6 standards (providentia/dependencies/GHOST_standards/1.6), which
# tests/test_species.py checks it against: if GHOST 1.6 changes, regenerate the GHOST species.
# A species that is not in GHOST can be added with the same fields.

