# Test forecast options with gridded models
# Each section gives the expected result in its comment

# OK: forecast field, interpolated and gridded
# grid read for lead days 2 and 4, showing the lead day of the entry selected for the map
[FIELD_DAY]
report_filename = test_gridded_forecast_FIELD_DAY
plots = forecast_gridded
network = EBAS
ghost_version = 1.6
species = sconco3
resolution = hourly
start_date = 20230101
end_date = 20230201
model = a59g-regional-000, a59g-regional-000::gridded
temporal_colocation = True
spatial_colocation = True
forecast = day2, day4

